<text x="44" y="37" font-size="15" font-weight="700" fill="#e6edf3">Como funciona: da configuração ao ícone fixado</text>
<text x="44" y="55" font-size="11" fill="#8b96a8">groupedTools.groups · painel Ferramentas · grupos · barra de atividades e barra de status</text>
<text x="1160" y="37" font-size="9.5" fill="#4b5563" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">FLUXO</text><text x="1160" y="52" font-size="9.5" fill="#2dd4bf" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">EXTENSÃO</text>
<g opacity="0"><animate attributeName="opacity" to="1" begin="0.3s" dur="0.4s" fill="freeze"/><rect x="40" y="140" width="230" height="90" rx="6" fill="#0d1a2e" stroke="#3b82f6" stroke-width="1.5"></rect><text x="155.0" y="162" font-size="11" font-weight="700" fill="#3b82f6" text-anchor="middle">1. Configuração</text><text x="155.0" y="182" font-size="9.5" fill="#e6edf3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">groupedTools.groups</text><text x="155.0" y="198" font-size="9.5" fill="#8b96a8" text-anchor="middle" >Global (padrão) ou Este projeto</text><text x="155.0" y="214" font-size="9.5" fill="#8b96a8" text-anchor="middle" >o painel grava a cada gesto</text></g>
<g opacity="0"><animate attributeName="opacity" to="1" begin="0.7s" dur="0.4s" fill="freeze"/><rect x="320" y="140" width="240" height="90" rx="6" fill="#1a0f00" stroke="#f59e0b" stroke-width="1.5"></rect><text x="440.0" y="162" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">2. Validação</text><text x="440.0" y="182" font-size="9.5" fill="#e6edf3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">src/config.js</text><text x="440.0" y="198" font-size="9.5" fill="#8b96a8" text-anchor="middle" >até 100 grupos, nome 100, comando 200</text><text x="440.0" y="214" font-size="9.5" fill="#8b96a8" text-anchor="middle" >remove caracteres de controle</text></g>
<g opacity="0"><animate attributeName="opacity" to="1" begin="1.1s" dur="0.4s" fill="freeze"/><rect x="610" y="140" width="250" height="90" rx="6" fill="#0d1a1a" stroke="#2dd4bf" stroke-width="1.5"><animate attributeName="stroke-opacity" values="0.35;1;0.35" dur="2.5s" repeatCount="indefinite"/></rect><text x="735.0" y="162" font-size="11" font-weight="700" fill="#2dd4bf" text-anchor="middle">3. Painel Ferramentas</text><text x="735.0" y="182" font-size="9.5" fill="#e6edf3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">src/tools-view.js, media/view.js</text><text x="735.0" y="198" font-size="9.5" fill="#8b96a8" text-anchor="middle" >busca, favoritos, modo Organizar</text><text x="735.0" y="214" font-size="9.5" fill="#8b96a8" text-anchor="middle" >grupos com cor e ícone Lucide</text></g>
<g opacity="0"><animate attributeName="opacity" to="1" begin="1.6s" dur="0.4s" fill="freeze"/><rect x="930" y="95" width="230" height="80" rx="6" fill="#1a0918" stroke="#f472b6" stroke-width="1.5"></rect><text x="1045.0" y="117" font-size="11" font-weight="700" fill="#f472b6" text-anchor="middle">4a. Barra de atividades</text><text x="1045.0" y="137" font-size="9.5" fill="#8b96a8" text-anchor="middle" >um ícone por grupo fixado</text><text x="1045.0" y="153" font-size="9.5" fill="#e6edf3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">media/pin/*.svg`, 40 do catálogo</text></g>
<g opacity="0"><animate attributeName="opacity" to="1" begin="1.9s" dur="0.4s" fill="freeze"/><rect x="930" y="205" width="230" height="80" rx="6" fill="#0d1a0d" stroke="#4ade80" stroke-width="1.5"></rect><text x="1045.0" y="227" font-size="11" font-weight="700" fill="#4ade80" text-anchor="middle">4b. Barra de status</text><text x="1045.0" y="247" font-size="9.5" fill="#e6edf3" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Nome (N)` à esquerda</text><text x="1045.0" y="263" font-size="9.5" fill="#8b96a8" text-anchor="middle" >card nativo com as extensões</text></g>
