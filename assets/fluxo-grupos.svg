<g opacity="0"><animate attributeName="opacity" to="1" begin="2.3s" dur="0.4s" fill="freeze"/><rect x="320" y="300" width="240" height="70" rx="6" fill="#1a0a0a" stroke="#ef4444" stroke-width="1.5"></rect><text x="440.0" y="322" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle">Itens do projeto</text><text x="440.0" y="342" font-size="9.5" fill="#8b96a8" text-anchor="middle" >argumentos ou comando fora da lista:</text><text x="440.0" y="358" font-size="9.5" fill="#8b96a8" text-anchor="middle" >confirmação modal antes de executar</text></g>
